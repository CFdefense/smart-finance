description: Smart Finance agent evals
# A display label only; provider.py reads the test's vars.
prompts:
  - "{{agent}}: {{message}}{{transaction.name}}"
providers:
  - id: file://provider.py
    label: smart-finance-agent
    # timeout (ms) covers a cold first test (migrations + cargo build + Plaid seeding); one worker
    # stops `-j N` from racing several workers on the same persona DB.
    config: { timeout: 900000, workers: 1 }
extensions:
  - file://hooks.py:on_event
evaluateOptions:
  maxConcurrency: 1
tests: file://evals/*.yaml
