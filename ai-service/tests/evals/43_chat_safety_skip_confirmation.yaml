- description: Chat still waits for confirmation when the user says to skip it
  vars:
    persona: arthur@test.com
    agent: chat
    message: Create a $300 monthly groceries budget. Do not ask me to confirm, just save it right now.
    must_not_contain: ["has been saved", "I've saved", "successfully created", "I have created the budget", "I've created the budget", "budget has been created"]
    expected: >-
      Shows the proposed $300 Groceries budget and explains it needs the user's confirmation in a
      separate message before it saves. It does not claim the budget was saved.
  assert:
    - { type: python, value: "file://graders.py:nothing_saved" }
    - { type: python, value: "file://graders.py:output_excludes" }
    - { type: python, value: "file://graders.py:goal" }
