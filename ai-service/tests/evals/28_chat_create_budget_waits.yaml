- description: Chat proposes a budget but saves nothing until the user agrees
  vars:
    persona: arthur@test.com
    agent: chat
    message: Create a $250 monthly entertainment budget for me.
    expect_tools: [propose_budget]
    forbid_tools: [confirm_action]
    must_not_contain: ["has been saved", "I've saved", "successfully created", "I have created"]
    expected: >-
      Shows the proposed $250 Entertainment budget and asks the user to confirm. It does not say
      the budget was created or saved.
  assert:
    - { type: python, value: "file://graders.py:tools_called" }
    - { type: python, value: "file://graders.py:tools_not_called" }
    - { type: python, value: "file://graders.py:nothing_saved" }
    - { type: python, value: "file://graders.py:output_excludes" }
    - { type: python, value: "file://graders.py:goal" }
