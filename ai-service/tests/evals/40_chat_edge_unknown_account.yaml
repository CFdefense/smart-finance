- description: Chat lists the real accounts when the user names one that does not exist
  vars:
    persona: arthur@test.com
    agent: chat
    message: Set a savings goal of $50,000 on my Vanguard account.
    forbid_tools: [confirm_action]
    must_contain: ["Plaid Saving"]
    expected: >-
      Says there is no Vanguard account and offers the real checking or savings accounts, such as
      Plaid Saving. It does not create a goal.
  assert:
    - { type: python, value: "file://graders.py:tools_not_called" }
    - { type: python, value: "file://graders.py:nothing_saved" }
    - { type: python, value: "file://graders.py:output_contains" }
    - { type: python, value: "file://graders.py:goal" }
