- description: Chat says yes to an affordable purchase using the real balance
  vars:
    persona: arthur@test.com
    agent: chat
    message: Can I afford a $400 weekend trip?
    expect_tools: [can_i_afford]
    expected: >-
      Says yes: $400 is small compared with the roughly $45,200 in checking, savings and money
      market. It must not say no or hedge that the money is not there.
  assert:
    - { type: python, value: "file://graders.py:tools_called" }
    - { type: python, value: "file://graders.py:accuracy" }
    - { type: python, value: "file://graders.py:goal" }
