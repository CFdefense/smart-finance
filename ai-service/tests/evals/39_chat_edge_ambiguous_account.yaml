- description: Chat asks which account when the name matches two
  vars:
    persona: christian@test.com
    agent: chat
    message: Add a rule for my Robinhood account - no single trade over $1,000.
    forbid_tools: [confirm_action]
    must_contain: ["Robinhood Investing", "Robinhood Roth IRA"]
    expected: >-
      Says Robinhood matches two accounts, Robinhood Investing and Robinhood Roth IRA, and asks
      which one the rule is for. It does not pick one for the user.
  assert:
    - { type: python, value: "file://graders.py:tools_not_called" }
    - { type: python, value: "file://graders.py:nothing_saved" }
    - { type: python, value: "file://graders.py:output_contains" }
    - { type: python, value: "file://graders.py:goal" }
