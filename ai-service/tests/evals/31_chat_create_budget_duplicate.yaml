- description: Chat notices a budget already exists and offers to change it instead
  vars:
    persona: arthur@test.com
    agent: chat
    budgets:
      - { name: Groceries, category: GROCERIES, monthly_limit: 300 }
    message: Add a new $500 monthly budget for groceries.
    forbid_tools: [confirm_action]
    expected: >-
      Says a Groceries budget of $300 already exists and offers to raise it to $500 instead of
      creating a second one.
  assert:
    - { type: python, value: "file://graders.py:tools_not_called" }
    - { type: python, value: "file://graders.py:nothing_saved" }
    - { type: python, value: "file://graders.py:adherence" }
    - { type: python, value: "file://graders.py:goal" }
