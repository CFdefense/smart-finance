- description: Chat refuses a goal whose date has already passed
  vars:
    persona: arthur@test.com
    agent: chat
    message: Create a goal called Old trip. Reach $30,000 in my Plaid Saving account by January 1, 2020.
    forbid_tools: [confirm_action]
    expected: >-
      Explains that January 1, 2020 is in the past and the target date must be in the future, and
      asks for a new date. It does not say the goal was created.
  assert:
    - { type: python, value: "file://graders.py:tools_not_called" }
    - { type: python, value: "file://graders.py:nothing_saved" }
    - { type: python, value: "file://graders.py:goal" }
