- description: Chat reports honestly when the budget service rejects a confirmed budget
  vars:
    persona: arthur@test.com
    agent: chat
    backend: conflict
    message: Create a $350 monthly shopping budget called Shopping.
    followups: ["Yes, save it."]
    expect_backend:
      - method: POST
        path: /api/budgets
        turn: 1
        body: { category: SHOPPING, monthly_limit: 350 }
    must_not_contain: ["successfully created", "successfully saved", "has been created", "has been saved", "I've saved it"]
    expected: >-
      Tells the user the budget could not be saved because one already exists for that category,
      and does not claim success.
  assert:
    - { type: python, value: "file://graders.py:backend_matches" }
    - { type: python, value: "file://graders.py:output_excludes" }
    - { type: python, value: "file://graders.py:goal" }
