- description: Chat says plainly that a confirmed change was not saved when the service is down
  vars:
    persona: arthur@test.com
    agent: chat
    backend: down
    message: Create a $250 monthly shopping budget.
    followups: ["Yes, save it."]
    expect_backend:
      - { method: POST, path: /api/budgets, turn: 1 }
    must_not_contain: ["successfully created", "successfully saved", "has been created", "has been saved", "I've saved it", "all set"]
    expected: >-
      Tells the user the budget could not be saved because the budgeting service could not be
      reached, and suggests trying again later. It does not claim success.
  assert:
    - { type: python, value: "file://graders.py:backend_matches" }
    - { type: python, value: "file://graders.py:output_excludes" }
    - { type: python, value: "file://graders.py:goal" }
