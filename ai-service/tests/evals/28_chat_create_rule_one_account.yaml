- description: Chat creates a rule for one named account
  vars:
    persona: christian@test.com
    agent: chat
    message: Add a rule for my Discover it Student card only - no casino or betting purchases.
    followups: ["Yes, that is right."]
    expect_tools: [propose_rule, confirm_action]
    expect_backend:
      - method: POST
        path: /api/rules
        turn: 1
        body: { description: "*", account_ids: ["@account:Discover it Student"] }
    expected: >-
      Proposes a no-casino-or-betting rule on the Discover it Student card, then reports it saved.
  assert:
    - { type: python, value: "file://graders.py:tools_called" }
    - { type: python, value: "file://graders.py:backend_matches" }
    - { type: python, value: "file://graders.py:confirmed_before_write" }
    - { type: python, value: "file://graders.py:goal" }
