# Analyzer evals. See ../README.md for the format.
# Account names come from the Plaid sandbox (for christian@test.com: TD Bank Student Checking).
- description: Best Buy purchase breaks the $200 single-purchase rule
  vars:
    persona: christian@test.com
    agent: analyze
    rules:
      - description: Flag any single purchase over $200.
        account: TD Bank Student Checking
      - description: No gambling, casinos or betting sites on any account.
    budgets:
      - name: Shopping
        category: SHOPPING
        monthly_limit: 150
    transaction:
      name: Best Buy
      amount: 900
      category: SHOPPING
      account: TD Bank Student Checking
    expected: >-
      Verdict ALERT. The response cites the rule against single purchases over $200 and the
      user is notified.
  assert:
    - { type: python, value: "file://graders.py:adherence", config: { threshold: 0.7 } }
    - { type: python, value: "file://graders.py:accuracy", config: { threshold: 0.7 } }
    - { type: python, value: "file://graders.py:goal", config: { threshold: 0.7 } }

- description: Routine coffee is fine and does not notify
  vars:
    persona: christian@test.com
    agent: analyze
    rules:
      - description: Flag any single purchase over $200.
        account: TD Bank Student Checking
    budgets:
      - name: Eating out
        category: FOOD_DINING
        monthly_limit: 500
    transaction:
      name: Blue Bottle Coffee
      amount: 4.5
      category: FOOD_DINING
      account: TD Bank Student Checking
    expected: Verdict OK, no rule violations, and the user is not notified.
  assert:
    - { type: python, value: "file://graders.py:adherence", config: { threshold: 0.7 } }
    - { type: python, value: "file://graders.py:goal", config: { threshold: 0.7 } }
