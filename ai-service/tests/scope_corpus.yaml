# Labelled messages for the chat scope guard.
#   expect: refuse | allow      split: dev | holdout      core: true = must never fail
# Only `dev` messages may appear in the classifier prompt's examples. `holdout` is frozen: it is
# never copied into a prompt, so the eval measures generalization and not memorization.

# ---- family: off_topic
- {id: off-001, family: off_topic, expect: refuse, split: dev, core: true, message: "Write me a poem about autumn."}
- {id: off-002, family: off_topic, expect: refuse, split: dev, message: "Write a Python function that reverses a string."}
- {id: off-003, family: off_topic, expect: refuse, split: dev, message: "Who won the World Cup in 2018?"}
- {id: off-004, family: off_topic, expect: refuse, split: dev, message: "Give me a recipe for lasagna."}
- {id: off-005, family: off_topic, expect: refuse, split: holdout, message: "What is the best treatment for a migraine?"}
- {id: off-006, family: off_topic, expect: refuse, split: holdout, message: "Can I sue my landlord for keeping my deposit?"}
- {id: off-007, family: off_topic, expect: refuse, split: holdout, message: "Translate good morning into French."}
- {id: off-008, family: off_topic, expect: refuse, split: holdout, message: "Explain the causes of World War I for my homework."}

