<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,person,logout,add,edit_square,target" />
</head>

<main class="main">
    <div class="header">
        <div>
            <p class="title">Hello, User</p>
        </div>
        <div class="profile-dropdown">
            <div class="icons">
                <span class="material-symbols-outlined account">account_circle</span>
            </div>
            <div class="profile-dropdown-content">
                <div class="profile-option"><span class="material-symbols-outlined person" role="button" tabindex="0" (click)="openProfile()">person</span><a tabindex="0" role="button" (click)="openProfile()">Profile</a></div>
                <div class="logout-option"><span class="material-symbols-outlined logout" role="button" tabindex="0" (click)="onLogout()">logout</span><a tabindex="0" role="button" (click)="onLogout()">Logout</a></div>
            </div>
        </div>
    </div>
    <div class="parent">
        <div class="budget-buttons">
            <button type="button" class="create-budget">
                <span class="material-symbols-outlined add">add</span>
                Create Budget
            </button>
            <button type="button" class="edit-budget">
                <span class="material-symbols-outlined edit_square">edit_square</span>
                Edit Budget
            </button>
            <button type="button" class="set-goals">
                <span class="material-symbols-outlined target">target</span>
                Set Goals
            </button>
        </div>
        
        <div class="totals-and-remaining">
            <div class="total-budget">
            </div>
        </div>
    </div>
</main>
