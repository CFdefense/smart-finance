<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,person,logout" />
</head>

<main class="main">
    <div class="header">
        <div>
            <p class="title">Hello, User</p>
        </div>
        <div class="profile-dropdown">
            <div class="icons">
                <span class="material-symbols-outlined account">account_circle</span>
            </div>
            <div class="profile-dropdown-content">
                <div class="profile-option"><span class="material-symbols-outlined person" role="button" (click)="openProfile()">person</span><a (click)="openProfile()">Profile</a></div>
                <div class="logout-option">
                    <button type="button" (click)="onLogout()">
                        <span class="material-symbols-outlined logout" aria-hidden="true">
                            logout
                        </span>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>
