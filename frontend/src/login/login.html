<head>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=savings,visibility,visibility_off" />
</head>

<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Finance Budgeting App</h1>
      <span class="material-symbols-outlined savings">savings</span>
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>

    <div class="right-side">
      <form (ngSubmit)="onLogin()">
        <div>
          <label class="login-label" for="email">Log into account</label>
        </div>

        <br />

        <div>
          <input
            type="email"
            id="email"
            name="email"
            class="login"
            placeholder="email"
            autocomplete="email"
            [(ngModel)]="email"
            required />

          <br />
          <br />

          <div class="password-wrapper">
            <input
              matInput
              [type]="hide ? 'password' : 'text'"
              id="password"
              name="password"
              class="login"
              placeholder="password"
              autocomplete="current-password"
              [(ngModel)]="password"
              required />
            <button
              type="button"
              class="password-visibility"
              (click)="hide = !hide"
              [attr.aria-label]="hide ? 'Hide password' : 'Show password'">
              @if (hide) {
                <span
                  class="material-symbols-outlined visibility_off"
                  [class]="hide ? 'visibility_off' : 'visibility_off'">
                  visibility_off
                </span>
              } @else {
                <span
                  class="material-symbols-outlined visibility"
                  [class]="hide ? 'visibility_off' : 'visibility'">
                  visibility
                </span>
              }
            </button>
          </div>
        </div>

        <br />

        <div>
          <button type="submit" class="login-button" [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'Logging in...' : 'Log in' }}
          </button>
        </div>

        @if (errorMessage()) {
          <p role="alert">{{ errorMessage() }}</p>
        }
      </form>

      <p>
        Don't have an account?
        <a routerLink="/signup">Sign up</a>
      </p>
    </div>
  </div>
</main>
