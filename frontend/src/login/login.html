<head>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=savings"
  />
</head>

<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Finance Budgeting App</h1>
      <span class="material-symbols-outlined">savings</span>
    </div>
    <div class="divider" role="separator" aria-label="Divider"></div>
    <div class="right-side">
      <div>
        <label class="login-label">Log into account</label>
      </div>
      <div>
        <input
          type="text"
          id="email"
          name="email"
          class="login"
          placeholder="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
        />
        <br />
        <input
          type="password"
          id="password"
          name="password"
          class="login"
          placeholder="password"
          autocomplete="password"
          [(ngModel)]="password"
          required
        />
      </div>
      <br />
      <div>
        <input type="button" class="login-button" value="Log in" (click)="onLogin()" />
      </div>
    </div>
  </div>
</main>
