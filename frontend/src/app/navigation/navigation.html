<!--
  Shared application navigation.

  RouterLink handles client-side navigation.
  RouterLinkActive highlights the currently selected page.
-->
<nav class="app-navigation" aria-label="Main navigation">
  <!-- Application branding -->
  <div class="navigation-brand">
    <span class="material-symbols-outlined" aria-hidden="true">account_balance_wallet</span>

    <span class="brand-name">Smart Finance</span>
  </div>

  <!-- Navigation links -->
  <div class="navigation-links">
    <!-- Dashboard -->
    <a
      class="navigation-link"
      routerLink="/dashboard"
      routerLinkActive="active"
      ariaCurrentWhenActive="page">
      <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
      <span>Dashboard</span>
    </a>

    <!-- Budgets: navigate to the dedicated budget management page. -->
    <a
      class="navigation-link"
      routerLink="/budgets"
      routerLinkActive="active"
      ariaCurrentWhenActive="page">
      <span class="material-symbols-outlined" aria-hidden="true">pie_chart</span>
      <span>Budgets</span>
    </a>

    <!-- Goals -->
    <a
      class="navigation-link"
      routerLink="/goals"
      routerLinkActive="active"
      ariaCurrentWhenActive="page">
      <span class="material-symbols-outlined" aria-hidden="true">flag</span>
      <span>Goals</span>
    </a>

    <!-- Rules: route not implemented yet -->
    <span class="navigation-link disabled" aria-disabled="true" title="Rules coming soon">
      <span class="material-symbols-outlined" aria-hidden="true">tune</span>
      <span>Rules</span>
    </span>

    <!-- Profile -->
    <div class="profile-dropdown">
      <div class="icons">
        <a
          class="profile-navigation"
          routerLink="/profile"
          routerLinkActive="active"
          ariaCurrentWhenActive="page">
          <span class="material-symbols-outlined account">account_circle</span>
        </a>
      </div>
      <div class="profile-dropdown-content">
        <div class="profile-option">
          <span
            class="material-symbols-outlined person"
            role="button"
            tabindex="0"
            (click)="openProfile()">
            person
          </span>
          <a tabindex="0" role="button" (click)="openProfile()">Profile</a>
        </div>
        <div class="logout-option">
          <span
            class="material-symbols-outlined logout"
            role="button"
            tabindex="0"
            (click)="onLogout()">
            logout
          </span>
          <a tabindex="0" role="button" (click)="onLogout()">Logout</a>
        </div>
      </div>
    </div>
  </div>
</nav>
