<head>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=savings" />
</head>

<main class="main">
    <div class="buttons">
        <button type="submit" class="button" (click)="openLogin()">Login</button>
        <button type="submit" class="button" (click)="openSignup()">Signup</button>
    </div>
    <div class="content">
        <div class="left-side">
            <div class="title">
                <h1>Finance Budgeting App</h1>
                <span class="material-symbols-outlined savings">savings</span>
            </div>
            <div class="blurb">
                <p class="description">
                    An all in one financial system designed to sync your money with linked financial accounts.
                    Create budgets, set goals, and view monthly spending. Eliminate guesswork of budgeting through an AI powered chat interface.
                </p>
            </div>
        </div>
        <div class="right-side">
            <img class="image" src="landing.png"/>
        </div>
    </div>
</main>
