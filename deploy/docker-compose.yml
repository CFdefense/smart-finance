name: smart-finance
services:
  db:
    image: postgres:16
    container_name: smart-finance-postgres
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:5432:5432" # 127.0.0.1 is a loopback address; VM has access, VPN does not.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service:
    image: smart-finance-ai-service
    container_name: smart-finance-ai-service
    build: 
      context: ../ai-service
      dockerfile: ../deploy/services/ai-service/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: 
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: smart-finance-backend
    container_name: smart-finance-backend
    build:
      context: ..
      dockerfile: deploy/services/backend/Dockerfile
      # The build itself needs Postgres (sqlx checks queries at compile time).
      # Host networking lets the build reach the db published on 127.0.0.1:5432.
      # Linux only -- see docs/DEVELOPMENT.md for building on macOS.
      network: host
      # Host networking is a privileged build option; newer Compose versions
      # refuse it unless it is explicitly allowed here.
      entitlements:
        - network.host
      args:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
        DOMAIN: ${DOMAIN:-localhost} # Cookie domain, compiled in. On the VM: the VM's IP.
    env_file: ../.env
    environment:
      BIND_ADDRESS: 0.0.0.0:3001 # Listen on all interfaces inside the container.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "3001:3001" # Reachable from the VPN; the browser calls the API directly.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: smart-finance-frontend
    container_name: smart-finance-frontend
    build:
      context: ../frontend
      dockerfile: ../deploy/services/frontend/Dockerfile
      # Second, named context so the Dockerfile can copy nginx.conf, which
      # lives outside ../frontend.
      additional_contexts:
        deploy: ./services/frontend
      args:
        API_URL: ${API_URL:-http://localhost:3001/api} # Baked into the JS at build time.
    ports:
      - "80:80" # Reachable from the VPN.
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
