name: smart-finance
services:
  db:
    image: postgres:16
    container_name: smart-finance-postgres
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:5432:5432" # 127.0.0.1 is a loopback address; VM has access, VPN does not.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    image: smart-finance-ai-service
    container_name: smart-finance-ai_service
    build: 
      context: ../ai-service
      dockerfile: ../deploy/services/ai-service/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: 
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
