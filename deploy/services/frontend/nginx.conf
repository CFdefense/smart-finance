# nginx site config for the Angular frontend (copied into the image as
# /etc/nginx/conf.d/default.conf by the Dockerfile next to this file).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: forward /api/... to the backend container over Docker's internal
    # network. The browser only ever talks to this server (port 80), so the
    # frontend can call the relative URL /api and needs no backend address,
    # there is no cross-origin request (no CORS), and the login cookie belongs
    # to whatever host the user opened. The path is passed through unchanged,
    # because the backend's routes already start with /api.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat replies are streamed; send each chunk on as it arrives instead
        # of waiting for the whole response.
        proxy_buffering off;
    }

    location / {
        # SPA fallback: serve the file if it exists; otherwise serve index.html
        # and let the Angular router handle the path. Without this, refreshing
        # a route such as /dashboard returns 404.
        try_files $uri $uri/ /index.html;
    }
}
