# nginx site config for the Angular frontend (copied into the image as
# /etc/nginx/conf.d/default.conf by the Dockerfile next to this file).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: serve the file if it exists; otherwise serve index.html
        # and let the Angular router handle the path. Without this, refreshing
        # a route such as /dashboard returns 404.
        try_files $uri $uri/ /index.html;
    }
}
